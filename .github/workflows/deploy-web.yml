# main에 푸시하면 웹 데모를 EAS Hosting(https://han-gajiman.expo.app)에 배포합니다.
# 디자이너·팀원이 백엔드 없이 화면을 둘러볼 수 있도록 목 모드로 만듭니다.
# 필요: 저장소 Settings → Secrets and variables → Actions에 EXPO_TOKEN (expo.dev → Access tokens에서 발급)
name: 웹 데모 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 연달아 푸시하면 이전 배포는 취소하고 마지막 것만 배포
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: EXPO_TOKEN 확인
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN이 없어서 배포를 건너뜁니다. 저장소 Secrets에 EXPO_TOKEN을 추가하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: 타입 검사·린트
        if: steps.token.outputs.ok == 'true'
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: 웹 내보내기 (목 모드)
        if: steps.token.outputs.ok == 'true'
        env:
          EXPO_PUBLIC_USE_MOCK: 'true'
          EXPO_PUBLIC_MOCK_SCENARIO: normal
          EXPO_PUBLIC_DEMO: 'true'
          EXPO_PUBLIC_DEV_LOGIN: 'false'
          # 저장소 Settings → Secrets and variables → Actions → Variables에 등록 (공개 키)
          EXPO_PUBLIC_KAKAO_JS_KEY: ${{ vars.EXPO_PUBLIC_KAKAO_JS_KEY }}
        run: npx expo export -p web

      - name: EAS Hosting 배포
        if: steps.token.outputs.ok == 'true'
        run: npx eas-cli@27.2.0 deploy --prod --non-interactive
